# beebots local lab: paper trading only. The dashboard binds only to the designated LAN address.
#
#   docker compose up -d        then open http://10.1.1.40:8080/ (including from this host)
#   docker compose logs engine  shows what the engine is doing (Setup is open for 2 hours after it starts)
#
# Build both images from this checkout; this file never pulls a BeeBots runtime image.
#
# Settings: everything below can be set in a local .env file. See .env.example.
name: beebots

services:
  engine:
    image: beebots-engine:local
    build: .
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Every setting in .env.example reaches the engine through this file, if you create it. Optional.
    env_file:
      - path: .env
        required: false
    environment:
      DRY_RUN: "true"
      MODE: dry
      TICK_MS: ${TICK_MS:-10000}
      BEE_START_EQUITY_USD: ${BEE_START_EQUITY_USD:-333}
      PAPER_CONTAINER_BIND: "true"
      ENGINE_PORT: "8080"
      DB_PATH: /data/bees-{mode}.sqlite
      SETTINGS_PATH: /data/settings.json
    volumes:
      - bees-data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: beebots-web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [engine]
    # Non-root Caddy with every capability dropped; the namespaced sysctl lets it bind 80/443.
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "10.1.1.40:${LAN_DASHBOARD_PORT:-8080}:80"
    environment:
      SITE_ADDRESS: :80
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  bees-data:
  caddy-data:
  caddy-config:
